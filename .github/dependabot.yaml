version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: "-"
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/test/simple"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: "-"
    groups:
      npm-dependencies:
        patterns:
          - "*"
